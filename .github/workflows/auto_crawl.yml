name: 自動每日爬取實習公告

on:
  schedule:
    # 每天台灣時間早上 08:00 自動執行 (UTC 00:00)
    - cron: '0 0 * * *'
  # 支援在 GitHub 網頁上手動點擊立即執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas feedparser

      - name: 執行實習爬蟲 (crawler.py)
        run: |
          python crawler.py

      - name: 檢查並自動提交更新至網站
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js 最新實習招募清單.csv || true
          git commit -m "🤖 自動更新：全台實習與社群公告 $(date '+%Y-%m-%d %H:%M')" || echo "資料無變更，略過提交"
          git push
