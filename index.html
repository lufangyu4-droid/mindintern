<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心實境 MindIntern | 台灣諮商實習公告聯搜網</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --star-active: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 2rem 1rem; }
        .container { max-width: 1080px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2rem; font-weight: 700; color: #0f172a; margin-bottom: 0.5rem; }
        header p { color: var(--text-sub); font-size: 1rem; }
        
        .controls { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .search-box input { width: 100%; padding: 0.75rem 1.25rem; font-size: 1rem; border: 1px solid var(--border); border-radius: 9999px; outline: none; background: white; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        
        .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
        .tab-btn { padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid var(--border); background: white; color: var(--text-sub); font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { background: #f1f5f9; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tab-btn.fav-tab.active { background: #d97706; border-color: #d97706; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .meta-stats { font-size: 0.9rem; color: var(--text-sub); }
        .btn-export { background: #10b981; color: white; border: none; padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.2s; }
        .btn-export:hover { background: #059669; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: transform 0.15s, box-shadow 0.15s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }

        .card-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.75rem; padding-right: 2rem; flex-wrap: wrap; }
        .badge { font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 6px; font-weight: 600; }
        .badge-area { background: #e0f2fe; color: #0369a1; }
        .badge-role { background: #fef3c7; color: #b45309; }
        .badge-fb { background: #dbeafe; color: #1e40af; }

        .star-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #cbd5e1; transition: color 0.2s; line-height: 1; }
        .star-btn.active { color: var(--star-active); }

        .card-source { font-size: 0.9rem; font-weight: 600; color: #475569; margin-bottom: 0.4rem; }
        .card-title { font-size: 1.05rem; font-weight: 700; color: #0f172a; line-height: 1.4; margin-bottom: 1rem; flex-grow: 1; }
        
        .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 0.75rem; border-top: 1px solid #f1f5f9; font-size: 0.8rem; color: var(--text-sub); }
        .btn-link { display: inline-block; padding: 0.4rem 0.85rem; background: var(--primary); color: white; border-radius: 6px; text-decoration: none; font-weight: 500; font-size: 0.85rem; }
        .btn-link:hover { background: var(--primary-hover); }
        .empty-tip { text-align: center; color: var(--text-sub); padding: 3rem 0; font-size: 1.1rem; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>心實境 MindIntern</h1>
            <p>全台諮商心理實習與甄選公告聯搜看板</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜尋學校名稱、諮商所或關鍵字（如：全職、兼職、特定縣市）...">
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-area="ALL">全部地區</button>
                <button class="tab-btn" data-area="雙北">雙北</button>
                <button class="tab-btn" data-area="桃竹苗">桃竹苗</button>
                <button class="tab-btn" data-area="中部">中部</button>
                <button class="tab-btn" data-area="南部">南部</button>
                <button class="tab-btn" data-area="東部">東部</button>
                <button class="tab-btn fav-tab" data-area="FAV">⭐ 我的收藏 (<span id="favCount">0</span>)</button>
            </div>
        </div>

        <div class="toolbar">
            <div class="meta-stats" id="stats">載入中...</div>
            <button class="btn-export" id="exportBtn">📥 匯出我的收藏清單 (CSV)</button>
        </div>

        <div class="grid" id="cardsGrid"></div>
    </div>

    <script src="data.js"></script>
    <script>
        let currentArea = "ALL";
        let searchQuery = "";
        let list = typeof internData !== "undefined" ? internData : [];
        let favorites = JSON.parse(localStorage.getItem("intern_favorites") || "[]");

        const grid = document.getElementById("cardsGrid");
        const stats = document.getElementById("stats");
        const favCountSpan = document.getElementById("favCount");
        const searchInput = document.getElementById("searchInput");
        const tabBtns = document.querySelectorAll(".tab-btn");
        const exportBtn = document.getElementById("exportBtn");

        function updateFavCount() {
            favCountSpan.innerText = favorites.length;
        }

        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem("intern_favorites", JSON.stringify(favorites));
            updateFavCount();
            render();
        }

        function render() {
            const filtered = list.filter(item => {
                const itemId = item["公告連結"] || item["公告標題"];
                const isFav = favorites.includes(itemId);

                let matchArea = true;
                if (currentArea === "FAV") {
                    matchArea = isFav;
                } else if (currentArea !== "ALL") {
                    matchArea = item["地區"] && item["地區"].includes(currentArea);
                }

                const text = `${item["來源機構"] || ""} ${item["公告標題"] || ""} ${item["招募類別"] || ""}`.toLowerCase();
                const matchSearch = text.includes(searchQuery.toLowerCase());

                return matchArea && matchSearch;
            });

            stats.innerText = `目前顯示：${filtered.length} 筆公告`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-tip">未發現符合條件的實習公告。</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const itemId = item["公告連結"] || item["公告標題"];
                const isFav = favorites.includes(itemId);
                const isFb = item["來源機構"] && item["來源機構"].includes("[FB]");

                return `
                    <div class="card">
                        <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${encodeURIComponent(itemId)}')">
                            ${isFav ? '★' : '☆'}
                        </button>
                        <div>
                            <div class="card-header">
                                <span class="badge badge-area">${item["地區"] || "全台"}</span>
                                <span class="badge badge-role">${item["招募類別"] || "實習"}</span>
                                ${isFb ? '<span class="badge badge-fb">FB 貼文</span>' : ''}
                            </div>
                            <div class="card-source">${item["來源機構"] || "未知機構"}</div>
                            <div class="card-title">${item["公告標題"]}</div>
                        </div>
                        <div class="card-footer">
                            <span>${item["抓取時間"] ? item["抓取時間"].split(" ")[0] : ""}</span>
                            <a href="${item["公告連結"]}" target="_blank" class="btn-link">查看公告 ↗</a>
                        </div>
                    </div>
                `;
            }).join("");
        }

        tabBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                tabBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentArea = btn.getAttribute("data-area");
                render();
            });
        });

        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value.trim();
            render();
        });

        // 匯出收藏清單為 CSV
        exportBtn.addEventListener("click", () => {
            const favItems = list.filter(item => {
                const itemId = item["公告連結"] || item["公告標題"];
                return favorites.includes(itemId);
            });

            if (favItems.length === 0) {
                alert("您目前尚未收藏任何機構，請先點擊卡片右上角星號「☆」加入收藏！");
                return;
            }

            let csvContent = "\uFEFF地區,來源機構,招募類別,公告標題,公告連結\n";
            favItems.forEach(item => {
                const row = [
                    `"${item['地區'] || ''}"`,
                    `"${item['來源機構'] || ''}"`,
                    `"${item['招募類別'] || ''}"`,
                    `"${(item['公告標題'] || '').replace(/"/g, '""')}"`,
                    `"${item['公告連結'] || ''}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `我的諮商實習投遞清單_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });

        updateFavCount();
        render();
    </script>
</body>
</html>
